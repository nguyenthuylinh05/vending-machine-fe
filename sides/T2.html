<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Sidebar</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        font-family: Arial, sans-serif;
      }

      /* Sidebar */
      .sidebar {
        width: 100%;
        height: 100vh; /* full chiều dọc */
        background: #f9f9f9;
        border-right: 2px solid #ddd;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 6px rgba(0, 0, 0, 0.1);
      }

      /* Tiêu đề */
      .sidebar h2 {
        background: linear-gradient(90deg, #ff512f, #dd0303);
        color: white;
        padding: 15px;
        text-align: center;
        font-size: 20px;
        border-bottom: 2px solid #ddd;
      }

      /* Menu */
      .menu {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .menu a {
        flex: 1; /* mỗi nút chiếm đều chiều cao */
        display: flex;
        align-items: center;
        justify-content: flex-start;
        padding: 0 20px;
        text-decoration: none;
        color: #333;
        font-size: 16px;
        border-bottom: 1px solid #e0e0e0;
        transition: 0.3s;
      }

      .menu a:hover {
        background: #ffe0e6;
        color: #d81b60;
        font-weight: bold;
        padding-left: 30px;
      }

      .menu a:first-child {
        color: #d81b60;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <h2>Danh mục</h2>
      <div class="menu">
        <a href="tabs/home.html" target="mainFrame">🏠 Trang chủ</a>
        <a href="tabs/product.html" target="mainFrame">🛒 Sản phẩm</a>
        <a href="tabs/drink.html" target="mainFrame">🥤 Máy bán nước</a>
        <a href="tabs/report.html" target="mainFrame">📊Thống kê</a>
        <a href="tabs/ai.html" target="mainFrame">🤖 Ảnh trả về từ AI</a>
        <!-- <a href="account.html" target="mainFrame">⚙️ Tài khoản</a> -->
      </div>
    </div>
  </body>
</html>
